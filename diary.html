<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Personal Diary</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://apis.google.com/js/api.js"></script>
</head>
<body>
    <div class="diary-container">
        <h1>Personal Diary</h1>
        <div class="diary-content">
            <label for="diary-date">Date:</label>
            <input type="date" id="diary-date" required>
            <textarea id="diary-text" placeholder="Write your diary entry here..."></textarea>
            <button id="save-entry">Save Entry</button>
        </div>
        <div class="entry-dates">
            <h2>Dates with Entries</h2>
            <ul id="entry-dates"></ul>
        </div>
    </div>
    <script src="auth.js"></script>
    <script src="diary.js"></script>
</body>
</html>
