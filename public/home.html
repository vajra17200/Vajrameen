<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="home-container">
        <h1>Welcome Musii/Kunjoo</h1>
        <div class="links">
            <a href="memories.html">📆 Memories & Important Dates</a>
            <a href="photos.html">🖼️ Photos</a>
            <a href="diary.html">📓 Personal Diary</a>
        </div>
        <button id="settings-btn">Settings</button>
    </div>
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Settings</h2>
            <label for="background-url">Background URL:</label>
            <input type="url" id="background-url">
            <button id="set-background">Set Background</button>
            <label for="font-size">Font Size:</label>
            <input type="number" id="font-size" min="10" max="30" value="50">
            <label for="font-family">Font Family:</label>
            <select id="font-family">
                <option value="Arial">Arial</option>
                <option value="Times New Roman">Times New Roman</option>
                <option value="Courier New">Courier New</option>
                <option value="elegant serif font-family">elegant serif font-family</option> 
            </select>
            <button id="apply-styles">Apply Styles</button>
        </div>
    </div>
    <script src="auth.js"></script>
    <script src="settings.js"></script>
</body>
</html>
