<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memories</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://apis.google.com/js/api.js"></script>
</head>
<body>
    <div class="memories-container">
        <h1>Memories & Important Dates</h1>
        <div id="memories-list"></div>
        <form id="add-memory-form">
            <label for="memory-date">Date:</label>
            <input type="date" id="memory-date" required>
            <label for="memory-text">Memory:</label>
            <textarea id="memory-text" required></textarea>
            <button type="submit">Add Memory</button>
        </form>
    </div>
    <script src="auth.js"></script>
    <script src="memories.js"></script>
</body>
</html>
